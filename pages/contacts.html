<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Контакты</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Перейти к основному содержимому</a>
    <div class="page">
        <header class="header">
            <div class="container">
                <div class="header-content">
                    <div class="logo">
                        <img src="../images/icons/profile-icon.svg" alt="" aria-hidden="true">
                        <span>Шувалов Станислав</span>
                    </div>
                    <nav class="nav" aria-label="Основная навигация">
                        <ul>
                            <li><a href="../index.html">Главная</a></li>
                            <li><a href="projects.html">Проекты</a></li>
                            <li><a href="diary.html">Дневник</a></li>
                            <li><a href="contacts.html" class="active" aria-current="page">Контакты</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>
        <main id="main" class="main">
            <div class="container">
                <section class="contact-form-section section">
                    <h1 class="section-title">Свяжитесь со мной</h1>
                    <form id="contact-form" class="contact-form" novalidate aria-describedby="form-status">
                        <fieldset>
                            <legend class="visually-hidden">Форма обратной связи</legend>
                            <div class="form-group">
                                <label for="name">Имя <span aria-hidden="true">*</span></label>
                                <input type="text" id="name" name="name" required aria-required="true" aria-describedby="name-error">
                                <div id="name-error" class="error-message visually-hidden" role="alert"></div>
                            </div>
                            <div class="form-group">
                                <label for="email">Email <span aria-hidden="true">*</span></label>
                                <input type="email" id="email" name="email" required aria-required="true" aria-describedby="email-error">
                                <div id="email-error" class="error-message visually-hidden" role="alert"></div>
                            </div>
                            <div class="form-group">
                                <label for="message">Сообщение <span aria-hidden="true">*</span></label>
                                <textarea id="message" name="message" rows="5" required aria-required="true" aria-describedby="message-error"></textarea>
                                <div id="message-error" class="error-message visually-hidden" role="alert"></div>
                            </div>
                            <button type="submit" class="btn">Отправить сообщение</button>
                        </fieldset>
                        <div id="form-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
                    </form>
                </section>
                <section class="contact-info section">
                    <h2 class="section-title">Контакты</h2>
                    <p>📧 shuvalov.s.d@edu.mirea.ru</p>
                    <p>📱 GitHub: coldw1nd</p>
                    <p>📍 Москва, Россия</p>
                </section>
            </div>
        </main>
        <footer class="footer">
            <div class="container"><p>© 2025 Шувалов Станислав.</p></div>
        </footer>
    </div>
    <script src="../scripts/script.js"></script>
</body>
</html>
